name: Update USD Price

on:
  workflow_dispatch:

  schedule:
    - cron: "*/1 * * * *"


permissions:
  contents: write


jobs:

  update-usd:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1



      - name: Get USD price

        run: |

          python - <<'PY'

          import urllib.request
          import json
          import re


          # ==========================
          # Get Nobitex USDT price
          # ==========================

          nobitex_url = (
              "https://apiv2.nobitex.ir/v3/orderbook/USDTIRT"
          )


          req = urllib.request.Request(

              nobitex_url,

              headers={
                  "User-Agent":
                  "Mozilla/5.0"
              }

          )


          response = urllib.request.urlopen(
              req,
              timeout=10
          )


          data = json.loads(
              response.read()
          )


          nobitex_price = None


          # lastTradePrice if exists

          if "lastTradePrice" in data:

              nobitex_price = float(
                  data["lastTradePrice"]
              )


          # fallback orderbook

          if not nobitex_price:

              asks = data.get(
                  "asks",
                  []
              )

              bids = data.get(
                  "bids",
                  []
              )


              prices = []


              for item in asks + bids:

                  try:

                      prices.append(
                          float(item[0])
                      )

                  except:

                      pass


              if prices:

                  nobitex_price = sum(prices) / len(prices)



          if not nobitex_price:

              raise Exception(
                  "Nobitex price not found"
              )



          # Rial to Toman

          target_price = round(
              nobitex_price / 10
          )


          print(
              "Nobitex Toman:",
              target_price
          )



          # ==========================
          # Read TGJU page
          # ==========================


          tgju_url = (
              "https://www.tgju.org/%D9%82%DB%8C%D9%85%D8%AA-%D8%AF%D9%84%D8%A7%D8%B1"
          )


          req = urllib.request.Request(

              tgju_url,

              headers={
                  "User-Agent":
                  "Mozilla/5.0"
              }

          )


          html = urllib.request.urlopen(

              req,

              timeout=10

          ).read().decode(

              "utf-8",

              errors="ignore"

          )



          # ==========================
          # Extract numbers
          # ==========================


          numbers = re.findall(

              r'[0-9۰-۹,]{5,}',

              html

          )


          candidates = []


          persian = "۰۱۲۳۴۵۶۷۸۹"


          for value in numbers:


              clean = value


              for i, digit in enumerate(persian):

                  clean = clean.replace(

                      digit,

                      str(i)

                  )


              clean = clean.replace(

                  ",",

                  ""

              )


              try:

                  number = int(clean)


                  # reasonable USD range

                  if 100000 < number < 5000000:

                      candidates.append(
                          number
                      )


              except:

                  pass



          if not candidates:

              raise Exception(
                  "No TGJU numbers found"
              )



          # ==========================
          # Find closest number
          # ==========================


          best = None

          best_percent = 999



          for number in candidates:


              diff = abs(

                  number -

                  target_price

              )


              percent = (

                  diff /

                  target_price

              ) * 100



              if percent < best_percent:

                  best_percent = percent

                  best = number



          print(
              "TGJU candidate:",
              best
          )


          print(
              "Difference:",
              round(best_percent,2),
              "%"
          )



          if best_percent > 1:

              raise Exception(
                  "No valid USD match within 1%"
              )



          # ==========================
          # Save file
          # ==========================


          with open(

              "usd.txt",

              "w",

              encoding="utf-8"

          ) as file:

              file.write(

                  str(best)

              )


          print(
              "Saved:",
              best
          )


          PY




      - name: Commit USD price

        run: |


          git config user.name \
          "github-actions[bot]"


          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"


          git add usd.txt


          if git diff --cached --quiet; then

              echo "USD price has not changed"

          else

              git commit \
              -m "Update USD price"

              git push

          fi
