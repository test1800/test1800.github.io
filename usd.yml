name: Update USD Price

on:
  workflow_dispatch:

  schedule:
    - cron: "*/2 * * * *"


permissions:
  contents: write


jobs:
  update-usd:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      - name: Get USD price from TGJU
        run: |

          python - <<'PY'

          import urllib.request
          import re


          url = "https://www.tgju.org/%D9%82%DB%8C%D9%85%D8%AA-%D8%AF%D9%84%D8%A7%D8%B1"


          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent":
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120 Safari/537.36"
              }
          )


          response = urllib.request.urlopen(
              request,
              timeout=10
          )


          html = response.read().decode(
              "utf-8",
              errors="ignore"
          )


          patterns = [

              r'دلار.{0,100}?([0-9۰-۹,]{5,})',

              r'USD.{0,100}?([0-9,]{5,})',

              r'price.{0,100}?([0-9,]{5,})'

          ]


          price = None


          for pattern in patterns:

              matches = re.findall(
                  pattern,
                  html,
                  re.IGNORECASE
              )


              for value in matches:

                  clean = value


                  persian = "۰۱۲۳۴۵۶۷۸۹"


                  for i, digit in enumerate(persian):

                      clean = clean.replace(
                          digit,
                          str(i)
                      )


                  clean = clean.replace(
                      ",",
                      ""
                  )


                  try:

                      number = int(clean)


                      if number > 100000:

                          price = number

                          break


                  except:

                      pass


              if price:

                  break



          if not price:

              print(
                  "Could not find USD price"
              )

              exit(1)



          toman = round(
              price / 10
          )


          print(
              "TGJU Rial:",
              price
          )


          print(
              "Toman:",
              toman
          )



          with open(
              "usd.txt",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  str(toman)
              )


          PY



      - name: Commit USD price

        run: |

          git config user.name \
          "github-actions[bot]"


          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"


          git add usd.txt


          if git diff --cached --quiet; then

              echo "USD price has not changed"

          else

              git commit \
              -m "Update USD price"

              git push

          fi
