name: Update Financial Chart History

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update FinancialChartHistoryauto.json
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import statistics

          FILE = "FinancialChartHistoryauto.json"

          APIS = {
              "Nobitex": "https://apiv2.nobitex.ir/v3/orderbook/USDTIRT",
              "Exir": "https://api.exir.io/v2/orderbook?symbol=usdt-irt",
              "Bitpin": "https://api.bitpin.org/api/v1/mth/orderbook/USDT_IRT/",
          }

          def fetch_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json",
                      "Cache-Control": "no-cache"
                  }
              )

              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          def extract_price(levels):
              if not isinstance(levels, list) or not levels:
                  return None

              level = levels[0]

              if isinstance(level, dict):
                  value = level.get("price")
              elif isinstance(level, (list, tuple)) and level:
                  value = level[0]
              else:
                  return None

              try:
                  value = float(value)
                  return value if value > 0 else None
              except (TypeError, ValueError):
                  return None

          def get_price(name, url):
              data = fetch_json(url)

              if name == "Nobitex":
                  if data.get("status") != "ok":
                      raise ValueError("Invalid Nobitex response")
                  book = data

              elif name == "Exir":
                  book = data.get("usdt-irt")
                  if not isinstance(book, dict):
                      book = data.get("USDT-IRT")
                  if not isinstance(book, dict):
                      book = data

              else:
                  book = data

              bids = book.get("bids", book.get("bid"))
              asks = book.get("asks", book.get("ask"))

              bid = extract_price(bids)
              ask = extract_price(asks)

              if bid is None or ask is None or bid > ask:
                  raise ValueError("Invalid bid/ask")

              return (bid + ask) / 2

          prices = []

          for name, url in APIS.items():
              try:
                  price = get_price(name, url)
                  prices.append(price)
                  print(f"{name}: {price}")
              except Exception as error:
                  print(f"{name} failed: {error}")

          if not prices:
              raise RuntimeError(
                  "All APIs failed; history was not modified."
              )

          average = statistics.mean(prices)
          timestamp = int(time.time() * 1000)

          data = {
              "format": "FinancialChartHistory",
              "version": 2,
              "encoding": "pairs",
              "count": 0,
              "history": []
          }

          if os.path.exists(FILE):
              with open(FILE, "r", encoding="utf-8") as f:
                  existing = json.load(f)

              if (
                  existing.get("format") != "FinancialChartHistory"
                  or existing.get("version") != 2
                  or existing.get("encoding") != "pairs"
                  or not isinstance(existing.get("history"), list)
              ):
                  raise ValueError("Invalid existing history file")

              data = existing

          history = data["history"]

          history.append([timestamp, average])
          data["count"] = len(history)

          with open(FILE, "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )
              f.write("\n")

          print("Average price:", average)
          print("Valid APIs:", len(prices))
          print("Total records:", data["count"])
          PY

      - name: Commit FinancialChartHistoryauto.json
        run: |
          git add FinancialChartHistoryauto.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update financial chart history"
            git push
          fi
