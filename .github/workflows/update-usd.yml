name: Update USD Price

on:

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"


permissions:

  contents: write


jobs:

  update-usd:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Get USD price from TGJU

        run: |

          python - <<'PY'


          import urllib.request
          import re
          import time
          import os



          url = "https://www.tgju.org/"



          html = None



          for attempt in range(3):

              try:

                  request = urllib.request.Request(

                      url,

                      headers={

                          "User-Agent":
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",

                          "Cache-Control":
                          "no-cache",

                          "Pragma":
                          "no-cache"

                      }

                  )


                  with urllib.request.urlopen(

                      request,

                      timeout=30

                  ) as response:


                      html = response.read().decode(

                          "utf-8",

                          errors="ignore"

                      )


                  break



              except Exception as e:


                  print(
                      "Retry:",
                      attempt + 1,
                      e
                  )


                  time.sleep(5)




          if not html:


              raise Exception(
                  "TGJU connection failed"
              )





          # ---------------------------------
          # Find Dollar row - live price
          # ---------------------------------


          patterns = [


              # جدول ارز آزاد TGJU

              r'دلار.*?قیمت\s*زنده.*?([0-9۰-۹,]{6,})',



              # حالت جایگزین

              r'دلار.*?([0-9۰-۹,]{6,})'


          ]



          rial_price = None



          for pattern in patterns:


              match = re.search(

                  pattern,

                  html,

                  re.DOTALL

              )


              if match:


                  value = match.group(1)


                  persian = "۰۱۲۳۴۵۶۷۸۹"



                  for i,d in enumerate(persian):


                      value = value.replace(

                          d,

                          str(i)

                      )



                  value = value.replace(

                      ",",

                      ""

                  )



                  try:


                      number = int(value)



                      # قیمت دلار ریالی

                      if 100000 < number < 10000000:


                          rial_price = number

                          break



                  except:


                      pass





          if not rial_price:


              raise Exception(

                  "USD price not found"

              )





          toman_price = round(

              rial_price / 10

          )




          print(
              "TGJU Rial:",
              rial_price
          )


          print(
              "TGJU Toman:",
              toman_price
          )





          # ---------------------------------
          # Update only if changed
          # ---------------------------------


          old = ""



          if os.path.exists(

              "usd.txt"

          ):


              old = open(

                  "usd.txt",

                  encoding="utf-8"

              ).read().strip()





          if old != str(toman_price):


              with open(

                  "usd.txt",

                  "w",

                  encoding="utf-8"

              ) as f:


                  f.write(

                      str(toman_price)

                  )


              print(
                  "USD updated"
              )


          else:


              print(
                  "No change"
              )


          PY





      - name: Commit USD price


        run: |


          git config user.name \
          "github-actions[bot]"


          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"



          git add usd.txt



          if git diff --cached --quiet; then


            echo "No changes"


          else


            git commit \
            -m "Update USD price"


            git push


          fi
