name: Update USD Price

on:

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"


permissions:

  contents: write


jobs:

  update-usd:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Get USD price from TGJU

        run: |

          python - <<'PY'

          import urllib.request
          import re
          import time
          import os



          url = "https://www.tgju.org/"



          html = None



          # -------------------------------
          # Download TGJU
          # -------------------------------


          for attempt in range(3):

              try:


                  request = urllib.request.Request(

                      url,

                      headers={

                          "User-Agent":
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",

                          "Cache-Control":
                          "no-cache",

                          "Pragma":
                          "no-cache"

                      }

                  )


                  with urllib.request.urlopen(

                      request,

                      timeout=30

                  ) as response:


                      html = response.read().decode(

                          "utf-8",

                          errors="ignore"

                      )


                  break



              except Exception as e:


                  print(
                      "Retry:",
                      attempt + 1,
                      e
                  )


                  time.sleep(5)




          if not html:


              raise Exception(
                  "TGJU connection failed"
              )





          # -------------------------------
          # Find Dollar Free Market Price
          # -------------------------------


          patterns = [


              r'price_dollar_rl.*?([0-9۰-۹,]{6,})',


              r'"price_dollar_rl".*?([0-9۰-۹,]{6,})',


              r'dollar_rl.*?([0-9۰-۹,]{6,})',


              r'دلار.*?([0-9۰-۹,]{6,})'


          ]



          rial_price = None



          persian = "۰۱۲۳۴۵۶۷۸۹"



          for pattern in patterns:


              matches = re.findall(

                  pattern,

                  html,

                  re.DOTALL

              )



              for value in matches:


                  for i,d in enumerate(persian):


                      value = value.replace(

                          d,

                          str(i)

                      )



                  value = value.replace(

                      ",",

                      ""

                  )



                  try:


                      number = int(value)



                      # valid rial USD range

                      if 1000000 < number < 10000000:


                          rial_price = number

                          break



                  except:


                      pass



              if rial_price:


                  break





          if not rial_price:


              # Debug file if failed

              with open(

                  "tgju_debug.html",

                  "w",

                  encoding="utf-8"

              ) as f:

                  f.write(html)



              raise Exception(

                  "Dollar price not found"

              )





          # -------------------------------
          # Rial to Toman
          # -------------------------------


          toman_price = round(

              rial_price / 10

          )



          print(
              "TGJU Rial:",
              rial_price
          )


          print(
              "TGJU Toman:",
              toman_price
          )





          # -------------------------------
          # Update file only if changed
          # -------------------------------


          old = ""



          if os.path.exists(

              "usd.txt"

          ):


              with open(

                  "usd.txt",

                  encoding="utf-8"

              ) as f:


                  old = f.read().strip()





          if old != str(toman_price):


              with open(

                  "usd.txt",

                  "w",

                  encoding="utf-8"

              ) as f:


                  f.write(

                      str(toman_price)

                  )


              print(
                  "USD updated"
              )


          else:


              print(
                  "No change"
              )


          PY





      - name: Commit USD price


        run: |


          git config user.name \
          "github-actions[bot]"


          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"



          git add usd.txt



          if git diff --cached --quiet; then


              echo "No changes"


          else


              git commit \
              -m "Update USD price"


              git push


          fi
