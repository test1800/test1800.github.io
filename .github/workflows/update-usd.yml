name: Update USD Price

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"


permissions:
  contents: write


jobs:

  update-usd:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1



      - name: Get USD price

        run: |

          python - <<'PY'

          import urllib.request
          import json
          import re


          # ==========================
          # Get Nobitex USDT price (Rial)
          # ==========================

          nobitex_url = (
              "https://apiv2.nobitex.ir/v3/orderbook/USDTIRT"
          )


          request = urllib.request.Request(
              nobitex_url,
              headers={
                  "User-Agent":
                  "Mozilla/5.0"
              }
          )


          response = urllib.request.urlopen(
              request,
              timeout=10
          )


          data = json.loads(
              response.read()
          )


          nobitex_price = None


          if "lastTradePrice" in data:

              nobitex_price = float(
                  data["lastTradePrice"]
              )


          if not nobitex_price:

              prices = []


              for item in (
                  data.get("asks", [])
                  +
                  data.get("bids", [])
              ):

                  try:

                      prices.append(
                          float(item[0])
                      )

                  except:

                      pass


              if prices:

                  nobitex_price = (
                      sum(prices)
                      /
                      len(prices)
                  )


          if not nobitex_price:

              raise Exception(
                  "Nobitex price not found"
              )



          # Keep Rial for comparison

          target_price = round(
              nobitex_price
          )


          print(
              "Nobitex Rial:",
              target_price
          )



          # ==========================
          # Read TGJU page
          # ==========================


          tgju_url = (
              "https://www.tgju.org/%D9%82%DB%8C%D9%85%D8%AA-%D8%AF%D9%84%D8%A7%D8%B1"
          )


          request = urllib.request.Request(
              tgju_url,
              headers={
                  "User-Agent":
                  "Mozilla/5.0"
              }
          )


          html = urllib.request.urlopen(
              request,
              timeout=10
          ).read().decode(
              "utf-8",
              errors="ignore"
          )



          # ==========================
          # Extract numbers
          # ==========================


          numbers = re.findall(
              r'[0-9۰-۹,]{5,}',
              html
          )


          candidates = []


          persian = "۰۱۲۳۴۵۶۷۸۹"


          for value in numbers:

              clean = value


              for i, digit in enumerate(persian):

                  clean = clean.replace(
                      digit,
                      str(i)
                  )


              clean = clean.replace(
                  ",",
                  ""
              )


              try:

                  number = int(clean)


                  # Rial USD range

                  if 100000 < number < 5000000:

                      candidates.append(
                          number
                      )


              except:

                  pass



          if not candidates:

              raise Exception(
                  "No TGJU numbers found"
              )



          # ==========================
          # Find closest Rial value
          # ==========================


          best = None

          best_percent = 999


          for number in candidates:


              diff = abs(
                  number -
                  target_price
              )


              percent = (
                  diff /
                  target_price
              ) * 100


              if percent < best_percent:

                  best_percent = percent

                  best = number



          print(
              "TGJU Rial:",
              best
          )


          print(
              "Difference:",
              round(best_percent, 3),
              "%"
          )



          if best_percent > 1:

              raise Exception(
                  "No valid USD match within 1%"
              )



          # ==========================
          # Rial to Toman
          # ==========================


          final_price = round(
              best / 10
          )


          print(
              "Saved Toman:",
              final_price
          )



          # ==========================
          # Save usd.txt
          # ==========================


          with open(
              "usd.txt",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  str(final_price)
              )


          PY





      - name: Commit USD price

        run: |


          git config user.name \
          "github-actions[bot]"


          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"


          git add usd.txt


          if git diff --cached --quiet; then

              echo "USD price has not changed"

          else

              git commit \
              -m "Update USD price"

              git push

          fi
