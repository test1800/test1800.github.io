
name: Update Financial Chart History

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch USDT prices and update history
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from statistics import mean

          FILE = "FinancialChartHistoryauto.json"

          APIS = {
              "Nobitex": "https://apiv2.nobitex.ir/v3/orderbook/USDTIRT",
              "Exir": "https://api.exir.io/v2/orderbook?symbol=usdt-irt",
              "Bitpin": "https://api.bitpin.org/api/v1/mth/orderbook/USDT_IRT/",
          }

          def fetch_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                  },
              )

              with urllib.request.urlopen(request, timeout=25) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          def get_levels(book, side):
              aliases = {
                  "bids": ("bids", "bid"),
                  "asks": ("asks", "ask"),
              }

              for key in aliases[side]:
                  value = book.get(key)
                  if isinstance(value, list) and value:
                      return value

              raise ValueError(f"Missing {side} levels")

          def parse_level(level):
              if isinstance(level, dict):
                  value = level.get("price")
              elif isinstance(level, (list, tuple)) and level:
                  value = level[0]
              else:
                  value = None

              if value is None:
                  raise ValueError("Missing order price")

              price = float(value)

              if not (price > 0 and price < float("inf")):
                  raise ValueError("Invalid order price")

              return price

          def get_price(name, url):
              response = fetch_json(url)

              if not isinstance(response, dict):
                  raise ValueError("Invalid API response")

              if name == "Nobitex":
                  if response.get("status") != "ok":
                      raise ValueError("Nobitex status is not ok")
                  book = response

              elif name == "Exir":
                  book = response.get("usdt-irt")
                  if not isinstance(book, dict):
                      book = response.get("USDT-IRT")
                  if not isinstance(book, dict):
                      book = response

              else:
                  book = response

              bids = get_levels(book, "bids")
              asks = get_levels(book, "asks")

              bid = parse_level(bids[0])
              ask = parse_level(asks[0])

              if bid > ask:
                  raise ValueError("Bid is greater than ask")

              # Midpoint of the best bid and best ask
              return (bid + ask) / 2

          prices = {}

          for name, url in APIS.items():
              try:
                  price = get_price(name, url)
                  prices[name] = price
                  print(f"{name} USDT/IRT: {price}")
              except Exception as error:
                  print(f"{name} API failed: {error}")

          # Require all three sources for a true three-source average.
          if len(prices) != 3:
              raise RuntimeError(
                  f"Expected 3 valid API prices; received {len(prices)}. "
                  "History was not modified."
              )

          average_price = mean(prices.values())
          timestamp = int(time.time() * 1000)

          if not (average_price > 0 and average_price < float("inf")):
              raise RuntimeError("Invalid average price")

          data = {
              "format": "FinancialChartHistory",
              "version": 2,
              "encoding": "pairs",
              "count": 0,
              "history": [],
          }

          if os.path.exists(FILE):
              with open(FILE, "r", encoding="utf-8") as file:
                  existing = json.load(file)

              if (
                  existing.get("format") != "FinancialChartHistory"
                  or existing.get("version") != 2
                  or existing.get("encoding") != "pairs"
                  or not isinstance(existing.get("history"), list)
              ):
                  raise ValueError(
                      "Existing history file has an invalid format"
                  )

              data = existing

          history = data["history"]

          if history and timestamp <= history[-1][0]:
              timestamp = history[-1][0] + 1

          history.append([timestamp, average_price])
          data["count"] = len(history)

          with open(FILE, "w", encoding="utf-8") as file:
              json.dump(
                  data,
                  file,
                  ensure_ascii=False,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              file.write("\n")

          print("Nobitex:", prices["Nobitex"])
          print("Exir:", prices["Exir"])
          print("Bitpin:", prices["Bitpin"])
          print("Three-source average:", average_price)
          print("Timestamp:", timestamp)
          print("Total history records:", data["count"])
          PY

      - name: Commit FinancialChartHistoryauto.json
        run: |
          git add FinancialChartHistoryauto.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update financial chart history"
            git push
          fi
