
name: Update Financial Chart History

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch USDT sell prices and update history
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import time
          import urllib.request
          from statistics import mean

          FILE = "FinancialChartHistoryauto.json"

          APIS = {
              "Nobitex": "https://apiv2.nobitex.ir/v3/orderbook/USDTIRT",
              "Exir": "https://api.exir.io/v2/orderbook?symbol=usdt-irt",
              "Bitpin": "https://api.bitpin.org/api/v1/mth/orderbook/USDT_IRT/",
          }

          MIN_TOMAN = 200_000
          MAX_TOMAN = 400_000

          def fetch_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "TraderBot/FinancialChartHistory",
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                  },
              )

              with urllib.request.urlopen(request, timeout=25) as response:
                  return json.loads(response.read().decode("utf-8"))

          def find_orderbook(data, name):
              if not isinstance(data, dict):
                  raise ValueError("Response is not a JSON object")

              if name == "Nobitex":
                  if data.get("status") != "ok":
                      raise ValueError(
                          f"Nobitex status: {data.get('status')}"
                      )
                  return data

              candidates = [data]

              for key in (
                  "data", "result", "orderbook",
                  "usdt-irt", "USDT-IRT"
              ):
                  value = data.get(key)
                  if isinstance(value, dict):
                      candidates.append(value)

              for candidate in candidates:
                  if isinstance(candidate.get("asks"), list):
                      return candidate

              raise ValueError("Sell orders (asks) not found")

          def first_sell_price(book):
              asks = book.get("asks")

              if not isinstance(asks, list) or not asks:
                  raise ValueError("No sell orders available")

              level = asks[0]

              if isinstance(level, dict):
                  raw = level.get("price")
              elif isinstance(level, (list, tuple)) and level:
                  raw = level[0]
              else:
                  raw = None

              if raw is None:
                  raise ValueError("Sell price missing")

              price = float(raw)

              if not math.isfinite(price) or price <= 0:
                  raise ValueError("Invalid sell price")

              return price

          def normalize_toman(raw_price):
              if MIN_TOMAN <= raw_price <= MAX_TOMAN:
                  return raw_price

              if (
                  raw_price > MAX_TOMAN
                  and MIN_TOMAN <= raw_price / 10 <= MAX_TOMAN
              ):
                  return raw_price / 10

              raise ValueError(
                  f"Price outside expected Toman range: {raw_price}"
              )

          prices = {}

          for name, url in APIS.items():
              try:
                  response = fetch_json(url)
                  book = find_orderbook(response, name)
                  raw_price = first_sell_price(book)
                  toman_price = normalize_toman(raw_price)

                  if (
                      math.isfinite(toman_price)
                      and toman_price > 0
                  ):
                      prices[name] = toman_price
                      print(
                          f"{name}: raw sell={raw_price}, "
                          f"sell Toman={toman_price}"
                      )
                  else:
                      print(f"{name} FAILED: invalid or zero price")

              except Exception as error:
                  print(f"{name} FAILED: {error}")

          # Use every available valid price; ignore zeros and negatives.
          valid_prices = {
              name: price
              for name, price in prices.items()
              if isinstance(price, (int, float))
              and math.isfinite(price)
              and price > 0
          }

          if not valid_prices:
              raise RuntimeError(
                  "No valid positive prices received. "
                  "History was not changed."
              )

          # One API works: use one price.
          # Two APIs work: average two prices.
          # Three APIs work: average all three prices.
          average_price = mean(valid_prices.values())

          print(f"Valid APIs: {len(valid_prices)}/3")
          print("Prices used in average:", valid_prices)
          print("Average sell Toman:", average_price)

          # Load existing history or create a new file.
          if os.path.exists(FILE):
              with open(FILE, "r", encoding="utf-8") as f:
                  data = json.load(f)

              if (
                  not isinstance(data, dict)
                  or data.get("format") != "FinancialChartHistory"
                  or data.get("version") != 2
                  or data.get("encoding") != "pairs"
                  or not isinstance(data.get("history"), list)
              ):
                  raise ValueError(
                      "Existing history format is invalid; "
                      "file was not overwritten."
                  )
          else:
              data = {
                  "format": "FinancialChartHistory",
                  "version": 2,
                  "encoding": "pairs",
                  "count": 0,
                  "history": [],
              }

          history = data["history"]
          timestamp = int(time.time() * 1000)

          if history:
              last_record = history[-1]

              if (
                  not isinstance(last_record, list)
                  or len(last_record) < 2
              ):
                  raise ValueError(
                      "Last history record is invalid."
                  )

              if timestamp <= last_record[0]:
                  timestamp = last_record[0] + 1

          history.append([timestamp, average_price])
          data["count"] = len(history)

          with open(FILE, "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              f.write("\n")

          print("History updated successfully.")
          print("History count:", data["count"])
          PY

      - name: Commit FinancialChartHistoryauto.json
        run: |
          git add -- FinancialChartHistoryauto.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update financial chart history"
            git push
          fi
